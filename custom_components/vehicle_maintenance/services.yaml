add_vehicle:
  name: Add vehicle
  description: Add a tracked vehicle using a seed template or custom values.
  fields:
    name:
      required: true
      example: Family Wagon
      selector:
        text:
    year:
      required: true
      example: 2024
      selector:
        number:
          min: 1900
          max: 2100
          mode: box
    make:
      required: true
      example: Subaru
      selector:
        text:
    model:
      required: true
      example: Outback
      selector:
        text:
    trim:
      example: Onyx XT
      selector:
        text:
    engine:
      example: 2.4T
      selector:
        text:
    vin:
      selector:
        text:
    purchase_date:
      description: Purchase or in-service date used for warranty tracking.
      selector:
        date:
    purchase_odometer:
      selector:
        number:
          min: 0
          mode: box
    warranty_start_date:
      description: Optional override if warranty start differs from purchase date.
      selector:
        date:
    warranty_years:
      selector:
        number:
          min: 0
          mode: box
    warranty_miles:
      selector:
        number:
          min: 0
          mode: box
    warranty_name:
      example: Subaru Added Security
      selector:
        text:
    current_odometer:
      example: 18250
      selector:
        number:
          min: 0
          mode: box
    odometer_source_mode:
      required: true
      selector:
        select:
          options:
            - manual
            - entity
    odometer_entity_id:
      selector:
        entity:
          domain: sensor
    template_id:
      selector:
        text:

edit_vehicle:
  name: Edit vehicle
  description: Update a tracked vehicle, including purchase and warranty metadata.
  fields:
    vehicle_id:
      required: true
      selector:
        text:

delete_vehicle:
  name: Delete vehicle
  description: Delete a tracked vehicle, its service history, and its registered entities.
  fields:
    vehicle_id:
      required: true
      example: 9cf9c0f839244a34b3a6e3b31c518f4d
      description: Find this in the attributes of any entity for the vehicle, or use the delete vehicle button on the device page.
      selector:
        text:

update_odometer:
  name: Update odometer
  description: Manually update a vehicle odometer.
  fields:
    vehicle_id:
      required: true
      selector:
        text:
    odometer:
      required: true
      example: 19442
      selector:
        number:
          min: 0
          mode: box

log_maintenance:
  name: Log maintenance
  description: Log a maintenance event for a single maintenance item. This is ideal for one-off work or early service like an out-of-cycle oil change.
  fields:
    vehicle_id:
      required: true
      selector:
        text:
    item_id:
      required: true
      selector:
        text:
    date:
      required: true
      selector:
        date:
    odometer:
      required: true
      selector:
        number:
          min: 0
          mode: box
    notes:
      selector:
        text:
    cost:
      selector:
        number:
          min: 0
          mode: box
    service_source:
      example: self
      selector:
        text:

log_service_visit:
  name: Log service visit
  description: Log a complete scheduled service visit or a multi-item maintenance visit.
  fields:
    vehicle_id:
      required: true
      selector:
        text:
    date:
      required: true
      selector:
        date:
    odometer:
      required: true
      selector:
        number:
          min: 0
          mode: box
    scheduled_mileage:
      description: Optional manufacturer visit mileage like 6000, 12000, 30000. When provided without item_ids, the integration logs all matching items from the vehicle schedule.
      selector:
        number:
          min: 0
          mode: box
    item_ids:
      description: Optional explicit item IDs to log as part of the visit.
      example:
        - engine_oil
        - rotate_and_inspect_tires
      selector:
        object:
    notes:
      selector:
        text:
    cost:
      selector:
        number:
          min: 0
          mode: box
    service_source:
      example: dealer
      selector:
        text:
