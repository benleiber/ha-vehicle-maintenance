add_vehicle:
  name: Add vehicle
  description: Add a tracked vehicle using a seed template or custom values.
  fields:
    name:
      required: true
      example: Family Wagon
      selector:
        text:
    year:
      required: true
      example: 2024
      selector:
        number:
          min: 1900
          max: 2100
          mode: box
    make:
      required: true
      example: Subaru
      selector:
        text:
    model:
      required: true
      example: Outback
      selector:
        text:
    trim:
      example: Onyx XT
      selector:
        text:
    engine:
      example: 2.4T
      selector:
        text:
    vin:
      selector:
        text:
    current_odometer:
      example: 18250
      selector:
        number:
          min: 0
          mode: box
    odometer_source_mode:
      required: true
      selector:
        select:
          options:
            - manual
            - entity
    odometer_entity_id:
      selector:
        entity:
          domain: sensor
    template_id:
      selector:
        text:

edit_vehicle:
  name: Edit vehicle
  description: Update a tracked vehicle.
  fields:
    vehicle_id:
      required: true
      selector:
        text:

delete_vehicle:
  name: Delete vehicle
  description: Delete a tracked vehicle and its service history.
  fields:
    vehicle_id:
      required: true
      selector:
        text:

update_odometer:
  name: Update odometer
  description: Manually update a vehicle odometer.
  fields:
    vehicle_id:
      required: true
      selector:
        text:
    odometer:
      required: true
      example: 19442
      selector:
        number:
          min: 0
          mode: box

log_maintenance:
  name: Log maintenance
  description: Log a maintenance event for a vehicle and maintenance item.
  fields:
    vehicle_id:
      required: true
      selector:
        text:
    item_id:
      required: true
      selector:
        text:
    date:
      required: true
      selector:
        date:
    odometer:
      required: true
      selector:
        number:
          min: 0
          mode: box
    notes:
      selector:
        text:
    cost:
      selector:
        number:
          min: 0
          mode: box
